# gateo 사이트 건강 주간 요약 (골격)
# @see plans/site-health-monitoring-plan.md

name: Health Weekly

permissions:
  contents: read

on:
  schedule:
    - cron: '7 22 * * 6'
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build weekly summary
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        with:
          script: |
            const weekly = require('./scripts/health/weekly-summary.cjs');
            const result = await weekly({ github, context, core });
            core.setOutput('week_tag', result.weekTag);
            core.setOutput('artifact', result.artifactName || '');

      - name: Upload weekly markdown
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: weekly-health-summary
          path: health/weekly-health-*.md
          retention-days: 30
          if-no-files-found: ignore
