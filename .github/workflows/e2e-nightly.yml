# Non-blocking E2E matrix (moved from CI). Schedule 03:00 KST (18:00 UTC).
# Playwright image tag must match package-lock @playwright/test version (currently 1.60.0).
# Jobs on mcr.microsoft.com/playwright:*-jammy must not run `playwright install --with-deps`
# (browsers + OS libraries are preinstalled; --with-deps re-runs apt and flakes on mirror sync).
name: E2E Nightly

permissions:
  contents: read

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'e2e-full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch (PR health guards)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      - name: Lint (src — no-undef blocking)
        run: npm run lint:ci

      - name: Health unit tests (test:health)
        run: npm run test:health

      - name: Place chat intro keys (parentCity fallback)
        run: npm run test:place-chat-intro-keys

      - name: Place video allowlist matches /place sources
        run: npm run check:place-video-catalog

      - name: Build
        run: npm run build

      - name: Blog editorial SEO smoke
        run: npm run smoke:search-exposure-p1

      - name: Festival road QA fixture absent from default prod bundle
        run: |
          if grep -rq '/qa/festival-road' dist/assets/; then
            grep -rl '/qa/festival-road' dist/assets/ || true
            exit 1
          fi
          shopt -s nullglob
          chunks=(dist/assets/FestivalRoadFixture*.js)
          if ((${#chunks[@]} > 0)); then
            ls -la "${chunks[@]}"
            exit 1
          fi

  festival-hero-credit-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'e2e-full'
    name: Festival hero credit E2E (WebKit)
    runs-on: ubuntu-24.04
    needs: lint-and-build
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Festival hero credit E2E (WebKit)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          DEV_SSL: '0'
        run: |
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-festival.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-festival.log
            exit 1
          fi
          SMOKE_SITE_URL=http://127.0.0.1:5173 npx playwright test e2e/korea-festival-hero-credit-en.spec.js --project=webkit-festival-hero-credit -g "direct \\?lang=en" --reporter=line


