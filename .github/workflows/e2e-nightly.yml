          CI: 'true'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
        run: |
          DEV_SSL=0 npx vite preview --host 127.0.0.1 --port 5195 --strictPort > /tmp/vite-place-gallery-overview.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5195/; then
              ready=1
