  e2e-nightly-failure-report:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.label.name == 'e2e-full') }}
    needs:
      - lint-and-build
      - festival-hero-credit-e2e
      - festival-poster-prior-e2e
      - festival-back-overview-e2e
      - festival-course-modal-webkit-e2e
      - place-course-modal-webkit-e2e
      - festival-region-chip-scroll-e2e
      - festival-city-place-e2e
      - festival-nearby-cards-e2e
      - festival-external-return-e2e
      - festival-road-wonju-e2e
      - place-travelogue-card-e2e
      - e2e-logbook-owner-edit
      - explore-search-bare-ko-e2e
      - place-gallery-overview-locale-e2e
      - khao-lak-place-qa-e2e
      - explore-v2-monthly-e2e
      - mooni-destination-pick-e2e
      - mooni-festival-detail-wait-e2e
      - place-header-locale-e2e
      - e2e-youtube-session
      - reels-locale-en-first-visit-e2e
      - logbook-review-filter-e2e
      - place-review-view-increment-e2e
      - logbook-review-detail-photo-e2e
      - place-review-deeplink-order-e2e
      - place-reviews-deeplink-chip-e2e
      - logbook-review-hub-nav-e2e
      - explore-collection-card-tap-e2e
      - explore-outside-tap-card-e2e
      - home-watch-card-e2e
      - home-monthly-destinations-e2e
      - article-festival-back-e2e
      - mooni-origin-input-e2e
      - explore-choseong-e2e
      - explore-suggest-rank-e2e
      - mooni-open-gemini-budget-e2e
      - tour-modal-region-search-e2e
      - airport-pickup-links-e2e
      - access-origin-default-e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update nightly failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failed = Object.entries(needs)
              .filter(([name, v]) => name !== 'e2e-nightly-failure-report' && (v.result === 'failure' || v.result === 'cancelled'))
              .map(([name]) => name);
            if (failed.length === 0) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `E2E Nightly: ${failed.length} job(s) failed (${new Date().toISOString().slice(0, 10)})`;
            const marker = '<!-- e2e-nightly-report -->';
            const body = [
              marker,
              `Workflow run: ${runUrl}`,
              '',
              '### Failed jobs',
              ...failed.map((j) => `- \`${j}\``),
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-nightly',
              per_page: 5,
            });
            const existing = issues.find((i) => i.title.startsWith('E2E Nightly:'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['e2e-nightly'],
              });
            }

