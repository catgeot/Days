            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-place-gallery-overview.log
            exit 1
          fi
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5195 PLACE_GALLERY_OVERVIEW_LOCALE_E2E=1 npx playwright test e2e/place-gallery-overview-locale-390.spec.js --project=chromium-place-gallery-overview-locale-390 --reporter=line


