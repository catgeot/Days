# gateo.kr Smoke Health — probe 2h · pages 6h
# @see plans/site-health-monitoring-plan.md

name: Smoke Health

permissions:
  contents: read

on:
  schedule:
    - cron: '23 */2 * * *'
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '가짜 실패 1건 추가(요약·dry-run 검증, job 실패 아님)'
        type: boolean
        default: false

jobs:
  probe:
    if: github.event_name != 'schedule' || github.event.schedule == '23 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: smoke-probe
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate repository secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL// /}" ] || [ -z "${VITE_SUPABASE_ANON_KEY// /}" ]; then
            echo "::error title=Secrets missing::Repository secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 가 비어 있습니다."
            exit 1
          fi
          KEY_LEN=${#VITE_SUPABASE_ANON_KEY}
          if [ "$KEY_LEN" -lt 100 ]; then
            echo "::error title=Invalid anon key::VITE_SUPABASE_ANON_KEY 길이가 너무 짧습니다 (${KEY_LEN})."
            exit 1
          fi
          case "$VITE_SUPABASE_ANON_KEY" in
            eyJ*) ;;
            *) echo "::error title=Invalid anon key::VITE_SUPABASE_ANON_KEY는 eyJ 로 시작하는 JWT여야 합니다."; exit 1 ;;
          esac

      - name: Run smoke health probes
        env:
          GITHUB_ACTIONS: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SMOKE_SITE_URL: https://www.gateo.kr/
          SMOKE_RESULT_FILE: health/smoke.json
        run: node scripts/smoke-health.mjs

      - name: Summarize smoke results
        if: always()
        env:
          HEALTH_SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: node scripts/health/summarize.mjs --layer smoke --smoke health/smoke.json

      - name: Report health issues
        if: always()
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        with:
          script: |
            const run = require('./scripts/health/report-issues.cjs');
            await run({ github, context, core, resultFile: 'health/health-result.json', layer: 'smoke' });

      - name: Upload health result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: health-result-probe
          path: health/health-result.json
          retention-days: 14

  pages:
    if: github.event_name != 'schedule' || github.event.schedule == '47 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: smoke-pages
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke page liveness (Playwright)
        env:
          TZ: Asia/Seoul
          SMOKE_SITE_URL: https://www.gateo.kr/
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_FILE: health/pages.json
        run: npx playwright test e2e/smoke-health-pages.spec.js --reporter=github,json

      - name: Summarize page smoke results
        if: always()
        run: node scripts/health/summarize.mjs --layer pages --playwright health/pages.json

      - name: Report health issues
        if: always()
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        with:
          script: |
            const run = require('./scripts/health/report-issues.cjs');
            await run({ github, context, core, resultFile: 'health/health-result.json', layer: 'pages' });

      - name: Upload health result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: health-result-pages
          path: health/health-result.json
          retention-days: 14
