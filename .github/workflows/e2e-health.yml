# gateo.kr Playwright E2E — 매일 06:23 KST
# @see plans/site-health-monitoring-plan.md

name: E2E Health

permissions:
  contents: read

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-health
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E against production
        env:
          TZ: Asia/Seoul
          SMOKE_SITE_URL: https://www.gateo.kr/
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_FILE: health/e2e.json
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=github,html,json

      - name: Summarize E2E results
        if: always()
        run: node scripts/health/summarize.mjs --layer e2e --playwright health/e2e.json

      - name: Report health issues
        if: always()
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        with:
          script: |
            const run = require('./scripts/health/report-issues.cjs');
            await run({ github, context, core, resultFile: 'health/health-result.json', layer: 'e2e' });

      - name: Upload health result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: health-result-e2e
          path: health/health-result.json
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
