# PR·main — lint(src no-undef) + production build gate
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (src — no-undef blocking)
        run: npm run lint:ci

      - name: Gemini prompt contract
        run: |
          npm run check:gemini-prompt-mirror
          npm run test:gemini-prompt-golden
          npm run test:gemini-proxy-error

      - name: Build
        run: npm run build
