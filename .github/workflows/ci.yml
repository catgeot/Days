  e2e-logbook-owner-edit:
    name: Logbook owner edit E2E (Chromium)
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
