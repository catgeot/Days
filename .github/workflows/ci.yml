            exit 1
          fi
          SMOKE_SITE_URL=http://127.0.0.1:5173 npx playwright test e2e/korea-festival-back-overview.spec.js --project=webkit-festival-back-overview --reporter=line

  festival-region-chip-scroll-e2e:
