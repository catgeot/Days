# PR·main — lint(src no-undef) + production build gate
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (src — no-undef blocking)
        run: npm run lint:ci

      - name: Build
        run: npm run build

  # YouTube 탭 세션(더 보기). 프로덕션 일일 헬스(e2e-health)에서는 제외.
  e2e-youtube-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: YouTube load-more session
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          DEV_SSL: '0'
          BROWSER: none
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173/
        run: |
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-dev.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-dev.log
            exit 1
          fi
          npx playwright test e2e/youtube-loadmore-session.spec.js --project=chromium-mobile --project=webkit-mobile --reporter=line
