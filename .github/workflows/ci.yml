# PR·main — lint(src no-undef) + production build gate
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    # WebKit --with-deps install can exceed 20m on slow apt days; prior lint/health/build ~5m.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (src — no-undef blocking)
        run: npm run lint:ci

      - name: Health unit tests (test:health)
        run: npm run test:health

      - name: Place video allowlist matches /place sources
        run: npm run check:place-video-catalog

      - name: Build
        run: npm run build

      - name: Festival hero credit E2E (WebKit)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          DEV_SSL: '0'
        run: |
          npx playwright install --with-deps webkit
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-festival.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-festival.log
            exit 1
          fi
          SMOKE_SITE_URL=http://127.0.0.1:5173 npx playwright test e2e/korea-festival-hero-credit-en.spec.js --project=webkit-festival-hero-credit -g "direct \\?lang=en" --reporter=line

  festival-back-overview-e2e:
    name: Festival back to overview E2E (WebKit 390)
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright WebKit — korea-festival-back-overview
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          MOONI_TOURAPI_STUB_ONLY: '1'
          DEV_SSL: '0'
        run: |
          npx playwright install --with-deps webkit
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-festival-back.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-festival-back.log
            exit 1
          fi
          SMOKE_SITE_URL=http://127.0.0.1:5173 npx playwright test e2e/korea-festival-back-overview.spec.js --project=webkit-festival-back-overview --reporter=line

  festival-external-return-e2e:
    name: Festival external return E2E (WebKit 390)
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright WebKit — korea-festival-external-return
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          MOONI_TOURAPI_STUB_ONLY: '1'
          DEV_SSL: '0'
        run: |
          npx playwright install --with-deps webkit
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-festival-external.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-festival-external.log
            exit 1
          fi
          SMOKE_SITE_URL=http://127.0.0.1:5173 npx playwright test e2e/korea-festival-external-return.spec.js --project=webkit-festival-external-return --reporter=line

  place-travelogue-card-e2e:
    name: Place travelogue card E2E (WebKit 390, fixtures)
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with travelogue card flag
        env:
          VITE_GATEO_PLACE_TRAVELOGUE_CARD: '1'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
        run: npm run build

      - name: Playwright WebKit — place-travelogue-card
        env:
          DEV_SSL: '0'
        run: |
          npx playwright install --with-deps webkit
          npx vite preview --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-travelogue.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-travelogue.log
            exit 1
          fi
          SMOKE_SITE_URL=http://127.0.0.1:5173 npx playwright test e2e/place-travelogue-card.spec.js --project=webkit-place-travelogue-card --reporter=line

  # YouTube 탭 세션(더 보기). 프로덕션 일일 헬스(e2e-health)에서는 제외.
  e2e-youtube-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: YouTube load-more session
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          DEV_SSL: '0'
          BROWSER: none
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173/
        run: |
          npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite-dev.log 2>&1 &
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/vite-dev.log
            exit 1
          fi
          npx playwright test e2e/youtube-loadmore-session.spec.js --project=chromium-mobile --project=webkit-mobile --reporter=line
