# PR·main — lint(src no-undef) + production build gate + 6 blocking E2E jobs
# Playwright image tag must match package-lock @playwright/test version (currently 1.60.0).
# Jobs on mcr.microsoft.com/playwright:*-jammy must not run `playwright install --with-deps`
# (browsers + OS libraries are preinstalled; --with-deps re-runs apt and flakes on mirror sync).
# Other E2E: .github/workflows/e2e-nightly.yml (schedule · workflow_dispatch · label e2e-full).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch (PR health guards)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      - name: Lint (src — no-undef blocking)
        run: npm run lint:ci

      - name: Health unit tests (test:health)
        run: npm run test:health

      - name: Place chat intro keys (parentCity fallback)
        run: npm run test:place-chat-intro-keys

      - name: Place video allowlist matches /place sources
        run: npm run check:place-video-catalog

      - name: Build
        run: npm run build

      - name: Blog editorial SEO smoke
        run: npm run smoke:search-exposure-p1

      - name: Festival road QA fixture absent from default prod bundle
        run: |
          if grep -rq '/qa/festival-road' dist/assets/; then
            grep -rl '/qa/festival-road' dist/assets/ || true
            exit 1
          fi
          shopt -s nullglob
          chunks=(dist/assets/FestivalRoadFixture*.js)
          if ((${#chunks[@]} > 0)); then
            ls -la "${chunks[@]}"
            exit 1
          fi


  explore-place-hard-back-e2e:
    name: Explore place hard back E2E (Chromium 1280·1024 · WebKit 390)
    runs-on: ubuntu-24.04
    needs: lint-and-build
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright — explore-place-hard-back
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
          CI: true
          DEV_SSL: '0'
        run: npx playwright test -c playwright.config.explore-place-hard-back.js --reporter=line


