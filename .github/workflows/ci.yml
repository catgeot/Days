      - name: Build for logbook owner-edit E2E
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-anon-placeholder
        run: npm run build

      - name: Playwright Chromium — logbook-public-owner-edit
        env:
          DEV_SSL: '0'
